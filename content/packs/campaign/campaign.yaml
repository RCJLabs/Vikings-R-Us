# The full campaign's part: Days 4-20 on top of the demo's Days 1-3 (docs/m7-design.md).
# Numbers are first guesses for `pnpm sim campaign` to tune. DRAFT text.
lastDay: 20
finale: ending.lastStand
# Oathbreakers sent to Valhalla will run at Ragnarök: they don't count as worthy einherjar.
worthy: pred.einherjar
# Only mistakes move standing (see the audit). These add to the demo's rows: a deliberate mistake can
# please the god who gains the soul, and letting Loki go pleases Loki.
standing:
  - { expected: VALHALLA, stamped: HEL, fx: { odin: -1, hel: 1 } }
  - { expected: VALHALLA, stamped: TRANSFER, fx: { odin: -1, clerk: 1 } }
  - { expected: HEL, stamped: TRANSFER, fx: { hel: -1, clerk: 1 } }
  - { expected: TRANSFER, stamped: HEL, fx: { clerk: -1, hel: 1 } }
  - { expected: TRANSFER, stamped: '*', fx: { clerk: -1 } }
  - { expected: DETAIN, stamped: '*', fx: { odin: -2, loki: 2 } }
# The gods' requests (docs/tech-spec.md §42): on some mornings a god asks, openly, for souls that belong to
# another. Doing it in full earns the reward, on top of the rows above; each soul is still sent wrong (no
# wage, a citation, a fine past the day's warnings). Declining costs nothing. Freyja and Hel both want Odin's
# warriors, so they can be rivals for them. The rows do most of the moving: a favour of Freyja's moves her 3
# (2 souls and the reward), which with her ending at 8 is what a bot devoted to her in the story still lacks
# (docs/tech-spec.md §42). First guesses; `pnpm sim campaign --serve <god>` measures them.
requests:
  from: 4
  chance: 50
  rivals: 25
  list:
    - { id: req.freyja, god: freyja, from: VALHALLA, to: FOLKVANGR, n: 2, reward: { freyja: 1 }, since: 4, text: request.freyja }
    - { id: req.odin, god: odin, from: FOLKVANGR, to: VALHALLA, n: 1, reward: { odin: 1 }, since: 4, text: request.odin }
    - { id: req.hel, god: hel, from: VALHALLA, to: HEL, n: 2, reward: { hel: 1 }, since: 5, text: request.hel }
    - { id: req.clerk, god: clerk, from: HEL, to: TRANSFER, n: 2, reward: { clerk: 1 }, since: 10, text: request.clerk }
# Favour (docs/tech-spec.md §43): at the gate each morning, every god whose standing is at a favour's mark grants
# it for the day and its night, and a god's favours add up. Like the upgrades, favours give time, information or
# money, never what decides a soul. The first come at 4, or at 3 for the two that ease hardship (sickness and
# fines); bots that court a god (its story and every request) hold them on a quarter to three quarters of their
# mornings, and those that don't, on up to a quarter (Hel's, for experts). The second come at 8, Freyja's and
# Hel's endings' mark: a fifth to two fifths of a courting expert's mornings, and never by accident. First guesses.
favours:
  - { id: fav.odin, faction: odin, at: 4, effect: { sunS: 60 }, text: favour.odin }
  - { id: fav.odin.more, faction: odin, at: 8, effect: { sunS: 60 }, text: favour.odin.more }
  - { id: fav.freyja, faction: freyja, at: 4, effect: { freeQuestions: 1 }, text: favour.freyja }
  - { id: fav.freyja.more, faction: freyja, at: 8, effect: { freeQuestions: 1 }, text: favour.freyja.more }
  - { id: fav.hel, faction: hel, at: 3, effect: { sickNights: 1, sickChancePct: 0 }, text: favour.hel }
  - { id: fav.hel.more, faction: hel, at: 8, effect: { sickNights: 1 }, text: favour.hel.more }
  - { id: fav.clerk, faction: clerk, at: 3, effect: { finePct: 50 }, text: favour.clerk }
  - { id: fav.clerk.more, faction: clerk, at: 8, effect: { finePct: 0 }, text: favour.clerk.more }
# Promotion (docs/tech-spec.md §44): two clean days in a row (every soul judged rightly, none left at dusk)
# bring the next rank's offer the next morning. A rank brings souls more each day (after the day's own), fewer
# mistakes forgiven before the fines, a higher wage and a tithe to Odin each night. Declining costs nothing, and
# a rank can be stepped down from at night (tonight's tithe is still owed). With +2 and +3 a soul and tithes of
# 6 and 14, promoted expert bots ended far richer (1,753 rings against 764); these leave them at 1,039 with a
# host a fifth stronger, and competent bots even. First guesses; `pnpm sim campaign --promote` measures them.
promotion:
  from: 4
  cleanDays: 2
  ranks:
    - { id: rank.second, name: rank.second, text: rank.second.text, souls: 2, warnings: -1, wage: 1, tithe: 20 }
    - { id: rank.first, name: rank.first, text: rank.first.text, souls: 4, warnings: -2, wage: 2, tithe: 45 }
# Speed only (docs/build-plan.md §1): cheaper tools and questions, more sun.
shop:
  - { id: up.sundial, name: shop.sundial, text: shop.sundial.text, price: 25, since: 4, effect: { sunS: 30 } }
  - { id: up.registryIndex, name: shop.registryIndex, text: shop.registryIndex.text, price: 20, since: 6, effect: { tool: registry, costS: 2 } }
  - { id: up.lensPolish, name: shop.lensPolish, text: shop.lensPolish.text, price: 30, since: 7, effect: { tool: runeLens, costS: 4 } }
  - { id: up.whetstone, name: shop.whetstone, text: shop.whetstone.text, price: 20, since: 8, effect: { tool: clippers, costS: 1 } }
  - { id: up.hornOfBrass, name: shop.hornOfBrass, text: shop.hornOfBrass.text, price: 35, since: 12, effect: { questionS: 10 } }
  - { id: up.waterClock, name: shop.waterClock, text: shop.waterClock.text, price: 40, since: 15, effect: { sunS: 60 } }
  # The late winter's sinks (M7.7): a competent player otherwise banks everything from Day 13 on.
  - { id: up.goldFeather, name: shop.goldFeather, text: shop.goldFeather.text, price: 40, since: 13, effect: { tool: feather, costS: 3 } }
  - { id: up.whaleLamp, name: shop.whaleLamp, text: shop.whaleLamp.text, price: 50, since: 16, effect: { sunS: 45 } }
  - { id: up.runeTable, name: shop.runeTable, text: shop.runeTable.text, price: 40, since: 17, effect: { tool: runeLens, costS: 2 } }
  - { id: up.silverHorn, name: shop.silverHorn, text: shop.silverHorn.text, price: 45, since: 18, effect: { questionS: 6 } }
# The vertical slice (M5): Days 1-3, then nine days pass and Day 12 is
# played, to prove the late game. What the skipped days bring (rings earned,
# standing, Ulf's new work in the north) is a guess. DRAFT.
slice:
  after: 3
  day: 12
  finale: ending.sliceEnd
  preset:
    rings: 30
    standing: { odin: 1, freyja: 1, clerk: 1 }
    flags: { slice: 1, ulf_shipyard: 1 }
# Checked every night, lowest order first; the demo's demoted (10) and alone (20) come before these.
# Faction endings wait for Ragnarök (Day 20's night); Naglfar can sail from Day 18.
endings:
  - id: ending.naglfar
    order: 100
    when: { all: [{ state: day, gte: 18 }, { state: flags.loki_deal, gte: 1 }, { state: naglfar, gte: 10 }] }
    title: ending.naglfar.title
    text: ending.naglfar.text
  - id: ending.rebirth
    order: 200
    when: { all: [{ state: day, gte: 20 }, { state: flags.wood, gte: 1 }, { state: flags.truth, gte: 3 }, { state: ragnarok, gte: 260 }, { state: family.home, gte: 1 }] }
    title: ending.rebirth.title
    text: ending.rebirth.text
  - id: ending.smuggled
    order: 300
    when: { all: [{ state: day, gte: 20 }, { state: flags.ferryman, gte: 1 }, { state: rings, gte: 100 }, { state: family.home, gte: 1 }] }
    title: ending.smuggled.title
    text: ending.smuggled.text
  - id: ending.transfer
    order: 400
    when: { all: [{ state: day, gte: 20 }, { state: flags.clerk_contract, gte: 1 }, { state: standing.clerk, gte: 4 }] }
    title: ending.transfer.title
    text: ending.transfer.text
  # Freyja's and Hel's endings take a run's courting (docs/tech-spec.md §42): at 8, a bot devoted to either in
  # the story comes short without her requests (0 and 2 runs of 12, expert), and reaches it with one (12 and 11).
  - id: ending.hel
    order: 500
    when: { all: [{ state: day, gte: 20 }, { state: lead.hel, gte: 1 }, { state: standing.hel, gte: 8 }] }
    title: ending.hel.title
    text: ending.hel.text
  - id: ending.freyja
    order: 510
    when: { all: [{ state: day, gte: 20 }, { state: lead.freyja, gte: 1 }, { state: standing.freyja, gte: 8 }] }
    title: ending.freyja.title
    text: ending.freyja.text
  - id: ending.odin
    order: 520
    when: { all: [{ state: day, gte: 20 }, { state: lead.odin, gte: 1 }] }
    title: ending.odin.title
    text: ending.odin.text
  - id: ending.wolf
    order: 990
    when: { all: [{ state: day, gte: 20 }, { state: ragnarok, lte: 240 }] }
    title: ending.wolf.title
    text: ending.wolf.text
  - { id: ending.lastStand, order: 1000, title: ending.lastStand.title, text: ending.lastStand.text }
  - { id: ending.sliceEnd, order: 1001, title: ending.sliceEnd.title, text: ending.sliceEnd.text }
# The journal's list of what's still in play (docs/story-drafts.md, "The journal"), in this order,
# each while its `when` holds. They name nobody the story hasn't named yet. The texts are DRAFT.
threads:
  - { id: thread.owesSkogul, when: { state: flags.owes_skogul, gte: 1 }, text: thread.owesSkogul }
  - id: thread.ulfDebt
    when: { all: [{ state: flags.ulf_debt, gte: 1 }, { state: flags.ulf_shipyard, lte: 0 }] }
    text: thread.ulfDebt
  - { id: thread.ulfShipyard, when: { state: flags.ulf_shipyard, gte: 1 }, text: thread.ulfShipyard }
  - { id: thread.lokiDeal, when: { state: flags.loki_deal, gte: 1 }, text: thread.lokiDeal }
  - { id: thread.ferry, when: { state: flags.ferryman, gte: 1 }, text: thread.ferry }
  - id: thread.woodKnown
    when: { all: [{ state: flags.wood_known, gte: 1 }, { state: flags.wood, lte: 0 }] }
    text: thread.woodKnown
  - { id: thread.wood, when: { state: flags.wood, gte: 1 }, text: thread.wood }
  - { id: thread.stayHome, when: { state: flags.stay_home, gte: 1 }, text: thread.stayHome }
  - { id: thread.clerkContract, when: { state: flags.clerk_contract, gte: 1 }, text: thread.clerkContract }
  - { id: thread.truth, when: { state: flags.truth, gte: 1 }, text: thread.truth, count: flags.truth }
