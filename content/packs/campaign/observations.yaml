# Searching the registry by name: the soul's own entry, someone else's with the same name, or nobody.
# Read from a document, not the body, and only with the registry tool.
- key: registry
  view: front
  doc: registry
  tool: registry
  since: 6
  salience: 2
  cost: 2
  from:
    map:
      - { when: { fact: outlaw, is: true }, value: listed }
      - { when: { fact: namesake, is: true }, value: namesake }
    otherwise: none
# Day 7: the carving on the weapon in hand, read with the rune-lens.
# "X á mik" means "X owns me"; a maker's mark says who forged the blade.
- key: inscription
  view: front
  tool: runeLens
  since: 7
  salience: 2
  cost: 1
  from: { map: [{ when: { fact: weaponOwner, is: other }, value: other }], otherwise: own }
  when: { fact: grip, is: weapon }
- key: makersMark
  view: front
  tool: runeLens
  since: 7
  salience: 2
  cost: 1
  from:
    map:
      - { when: { fact: blade, is: ulfberht }, value: markTrue }
      - { when: { fact: blade, is: fakeUlfberht }, value: markCopy }
    otherwise: none
  when: { fact: grip, is: weapon }
# Day 8: the hands, read directly.
- { key: nails, view: front, since: 8, salience: 2, cost: 1, from: { fact: nailsGrown } }
# Day 10: an amulet on a cord at the neck. A cross means baptized, Thor's hammer means heathen, and a
# hammer and a cross on one cord means prime-signed. Heathens without a hammer wear nothing.
- key: amulet
  view: front
  since: 10
  salience: 2
  cost: 1
  from:
    map:
      - { when: { fact: faith, is: baptized }, value: cross }
      - { when: { fact: faith, is: primeSigned }, value: hammerAndCross }
      - { when: { fact: thorsHammer, is: true }, value: hammer }
    otherwise: none
# Day 12: small stitch scars across the lips. The subtlest sign in the game (salience 1).
- key: lipScars
  view: front
  since: 12
  salience: 1
  cost: 1
  from: { map: [{ when: { fact: trickster, is: true }, value: stitched }], otherwise: none }
# Day 17: the spear mark, cut over the heart before death.
- { key: spearCut, view: front, since: 17, salience: 2, cost: 1, from: { fact: spearMark } }
