name: Deploy web demo

# Publishes the free web demo (Days 1-3 + Daily Shift) to GitHub Pages.
# Needs Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web-demo
        env:
          # Optional links (Settings -> Secrets and variables -> Actions -> Variables).
          VITE_TELEMETRY_URL: ${{ vars.TELEMETRY_URL }}
          VITE_COMMUNITY_URL: ${{ vars.COMMUNITY_URL }}
          VITE_STEAM_URL: ${{ vars.STEAM_URL }}
      - run: pnpm leak-check --targets web-demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
